CONFIG_ZMK_SLEEP=y
# Times are in ms.
# 30 seconds
CONFIG_ZMK_IDLE_TIMEOUT=30000
# 20 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

CONFIG_ZMK_KEYBOARD_NAME="Leon-Lily58"

# --- Windows BLE 兼容性优化 ---
# 关闭 2M PHY：ZMK 官方点名 Windows (Realtek/Intel 芯片) 兼容性问题
CONFIG_BT_CTLR_PHY_2M=n
# 提高发射功率，改善分体链路和重连速度（nRF52840 支持，功耗差异可忽略）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 绕过 Windows 电池通知的已知 bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# CONFIG_ZMK_STUDIO=y

# CONFIG_ZMK_STUDIO_LOCKING=n

# CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

CONFIG_BT_BAS=y

CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
